comparison:
  baseline_name: tizen-gcc
  candidate_name: tizen-llvm
  # User-declared provenance, not inferred from compiler strings in binaries.
  baseline_toolchain: gcc
  candidate_toolchain: llvm
analysis:
  modes: [elf, abi, api, headers, linking, compiler_runtime, kernel, ipc, commands, filesystem, packages, services, security, runtime, hardware, network, performance]
  ignore_build_ids: true
  ignore_timestamps: true
  normalize_build_paths: true
  workers: 4
  timeout_seconds: 60 # Short collector operations.
  extract_timeout_seconds: 3600 # SquashFS, rpm2cpio and EROFS extraction.
  rpmdb_timeout_seconds: 900 # Installed RPM database queries on the scratch copy.
  abi_timeout_seconds: 1800 # abidiff per ELF pair.
  max_text_bytes: 4194304
  max_readelf_bytes: 536870912 # Combined capture cap per readelf invocation.
  max_extract_bytes: 107374182400
  max_extract_files: 2000000
  input_scope: {} # Example: {baseline: {ramdisk: false, xattrs: false, hardlinks: false}}
tools: {} # Example: {readelf: /opt/bin/aarch64-linux-gnu-readelf, abidiff: false}
rpm_payload:
  mode: payload # metadata omits decompression and ELF collection.
  max_bytes: 1073741824
  max_elf_bytes: 268435456
  max_files: 100000
  max_packages: 100000
  timeout_seconds: 3600 # Legacy payload ceiling. A smaller override may further limit extraction.
  max_metadata_bytes: 134217728 # Per RPM query, combined stdout and stderr. Maximum 1 GiB.
preparation:
  platform_partition: pltf_t.img
  xz_memory_mib: 256
  adapter_timeout_seconds: 1800 # VDFS adapter. EROFS uses analysis.extract_timeout_seconds.
  vdfs_adapter: {} # Optional trusted host adapter. See references/image_preparation.md.
  erofs_adapter: {} # Optional trusted vendor extractor.
  erofs_scratch_mib: 1024 # Private tmpfs cap for standard fsck.erofs.
loader:
  environments: {} # Unknown by default; see references/correctness.md before asserting completeness.
debuginfo:
  roots: {} # e.g. baseline: [/artifacts/gcc-debuginfo-root], candidate: [/artifacts/llvm-debuginfo-root]
runtime:
  enabled: false
  authorized: false
  timeout_seconds: 60
  environments: {}
  probes: []
cross_compilation:
  enabled: true
  c_tests: true
  cpp_tests: true
  sysroots: {}
  compilers: {}
  include_dirs: [usr/include]
  header_limit: 50
  probes: []
  builds: {} # Explicit compiler -> {sdk, reference_image, provenance}; no implicit GCC/Clang mapping.
  semantic_headers: false # Optional configured Clang AST evidence, not whole-API proof.
  target_abis: {} # Primary SDK ABI with provenance; see references/execution.md for ARM PCS fields.
  runtime_objects: {} # Selected authoritative target loader/libc virtual paths per image.
  sdk_package_manifests: {} # Installed SDK RPM manifests, image.source must match sysroots.<label>.
performance:
  enabled: false
  tolerance_percent: 10
report:
  html: true
  json: true
  markdown: true
  csv: true
  symbol_differences: changes # Use all to include MATCHED rows. Summary counts always include them.
ci:
  fail_on: HIGH
  strict: false
  fail_on_collector_failure: true
  minimum_coverage: {} # e.g. {abi: 90, linking: 95, runtime: 100}; percentages of applicable contracts
severity_overrides: {} # Example: {performance: MEDIUM}
