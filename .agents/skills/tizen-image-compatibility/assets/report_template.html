<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tizen compatibility report</title>
<style>body{font:16px system-ui,sans-serif;max-width:1440px;margin:40px auto;padding:0 24px;color:#172332;background:#f5f7fa}h1,h2{color:#183d60}table{border-collapse:collapse;width:100%;background:white;margin:16px 0;table-layout:fixed}th,td{text-align:left;border:1px solid #ccd5df;padding:10px;vertical-align:top}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font-size:13px}details{background:white;border:1px solid #ccd5df;margin:8px 0;padding:12px}summary{cursor:pointer;overflow-wrap:anywhere}.status{font-weight:bold;font-size:24px}input{box-sizing:border-box;width:100%;padding:12px;font:inherit}@media print{input{display:none}}</style>
<main>{{CONTENT}}</main>
<script>document.getElementById('filter').addEventListener('input',function(){const q=this.value.toLowerCase();document.querySelectorAll('.finding').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(q));});document.getElementById('package-filter')?.addEventListener('input',function(){const q=this.value.toLowerCase();document.querySelectorAll('.package').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(q));});</script></html>
